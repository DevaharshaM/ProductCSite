<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discover Your Engineering Path — Pravaha Path</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght=0,300;0,400;0,500;1,300;1,400&family=DM+Mono:ital,wght=0,300;0,400;1,300&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #102A2A;
      --surface:   #163636;
      --surface2:  #122f2f;
      --border:    rgba(148, 163, 184, 0.12);
      --accent:    #5EEAD4;
      --accent-dim:#3ecfb8;
      --muted:     #9FB7B9;
      --muted2:    #6B8C8E;
      --text:      #E6FFFA;
      --text-soft: #B2CECE;
      --glow:      rgba(94, 234, 212, 0.06);
    }

    body {
      font-family: 'Instrument Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.65;
    }

    /* ── Noise texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* ── Navbar ── */
    nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 3rem;
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--text);
      text-decoration: none;
    }

    .nav-logo span {
      color: var(--accent);
      font-style: italic;
    }

    .workspace-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 8rem 2rem 5rem;
    }

    .header-section {
      margin-bottom: 3.5rem;
    }

    .workspace-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 4.5vw, 3rem);
      font-weight: 300;
      line-height: 1.25;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .workspace-desc {
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 300;
      line-height: 1.75;
    }

    /* ── Form Layout ── */
    .form-group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2rem;
      margin-bottom: 2rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-group:focus-within {
      border-color: rgba(94, 234, 212, 0.25);
      box-shadow: 0 0 20px rgba(94, 234, 212, 0.02);
    }

    .form-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 400;
      color: var(--text-soft);
      margin-bottom: 0.8rem;
      display: block;
    }

    .form-textarea {
      width: 100%;
      min-height: 200px;
      background: rgba(16, 42, 42, 0.4);
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--text);
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      padding: 1rem 1.2rem;
      resize: vertical;
      outline: none;
      line-height: 1.65;
      transition: border-color 0.2s ease;
    }

    .form-textarea:focus {
      border-color: rgba(94, 234, 212, 0.35);
    }

    .form-textarea::placeholder {
      color: var(--muted2);
      opacity: 0.7;
    }

    /* Divider & Upload Elements */
    .divider-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 1.25rem 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider-text {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted2);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .file-upload-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: rgba(16, 42, 42, 0.2);
      border: 1px dashed var(--border);
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .file-upload-zone:hover {
      background: rgba(94, 234, 212, 0.02);
      border-color: rgba(94, 234, 212, 0.25);
    }

    .upload-text {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .file-name-indicator {
      margin-top: 0.8rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent);
      display: none;
      letter-spacing: 0.02em;
    }

    /* Submit Actions */
    .action-container {
      display: flex;
      justify-content: center;
      margin-top: 3.5rem;
    }

    .btn-submit {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.9rem 2.2rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-submit:hover {
      background: transparent;
      color: var(--text);
      border-color: rgba(94, 234, 212, 0.5);
      box-shadow: 0 0 30px rgba(94, 234, 212, 0.1);
    }

    .btn-submit svg { transition: transform 0.25s ease; }
    .btn-submit:hover svg { transform: translateX(4px); }

    .footer-minimal {
      margin-top: 6rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      display: flex;
      justify-content: flex-end;
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted2);
    }

    @media(max-width: 700px) {
      nav { padding: 1.5rem; }
      .workspace-container { padding-top: 7rem; }
      .form-group { padding: 1.25rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="index.html">
      Pravaha <span>Path</span>
    </a>
  </nav>

  <main class="workspace-container">
    
    <header class="header-section">
      <h1 class="workspace-title">Discover Your Engineering Path</h1>
      <p class="workspace-desc">Engineering growth becomes clearer when direction aligns with curiosity, strengths, and the way you naturally think.</p>
    </header>

    <form id="onboardingForm" onsubmit="handleWorkflow(event)">
      
      <section class="form-group">
        <label class="form-label" for="aboutInput">Your Experience, interests or strengths</label>
        <textarea 
          id="aboutInput" 
          class="form-textarea" 
          placeholder="Tell us about yourself — your background, structural strengths, architectural patterns you like, or complex hardware/software systems you enjoy building..."
        ></textarea>
        
        <div class="divider-container">
          <div class="divider-line"></div>
          <span class="divider-text">or</span>
          <div class="divider-line"></div>
        </div>

        <label class="file-upload-zone" for="resumeUpload">
          <span class="upload-text">Upload Resume (PDF, DOCX)</span>
        </label>
        <input type="file" id="resumeUpload" accept=".pdf,.docx" style="display: none;" onchange="updateFileName(this)" />
        <div id="fileName" class="file-name-indicator"></div>
      </section>

      <section class="form-group">
        <label class="form-label" for="interestsInput">Career Interests</label>
        <textarea 
          id="interestsInput" 
          class="form-textarea" 
          placeholder="What kind of sub-domains are you looking to target? (e.g., bare-metal development, firmware architectures, hardware-in-the-loop (HIL) testing, or RTOS-based system integration...)"
        ></textarea>
      </section>

      <div class="action-container">
        <button type="submit" class="btn-submit">
          Discover Your Path
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

    </form>

    <footer class="footer-minimal">
      <span>pravaha path &nbsp;·&nbsp; 2026</span>
    </footer>

  </main>

  <script>
    function updateFileName(element) {
      const display = document.getElementById('fileName');
      
      if (element.files && element.files.length > 0) {
        const file = element.files;
        const fileName = file.name;
        const fileExtension = fileName.split('.').pop().toLowerCase();
        
        // Validation check against correct expansion profiles
        if (fileExtension !== 'pdf' && fileExtension !== 'docx') {
          alert("The file format is only pdf or docx.");
          element.value = ''; // Flush selected element context data
          display.style.display = "none";
          return;
        }

        // Output formatting
        display.textContent = "Attached: " + fileName;
        display.style.display = "block";
      } else {
        display.style.display = "none";
      }
    }

    function handleWorkflow(e) {
      e.preventDefault();
      
      const about = document.getElementById('aboutInput').value.trim();
      const interests = document.getElementById('interestsInput').value.trim();
      const fileInput = document.getElementById('resumeUpload');

      if (!about && !interests && (!fileInput.files || fileInput.files.length === 0)) {
        alert("Please provide context regarding your background or targeted sub-domains to proceed.");
        return;
      }

      alert("Trajectory parsing complete. Data validated on frontend. Ready to plug into context classification engines.");
    }
  </script>

</body>
</html>
